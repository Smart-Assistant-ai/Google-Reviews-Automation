name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    # GitHub starts this database for the run and throws it away afterwards.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: replypilot
          POSTGRES_PASSWORD: replypilot
          POSTGRES_DB: replypilot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U replypilot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://replypilot:replypilot@localhost:5432/replypilot_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
